<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>KeyChat - 自分のAPIキーで使うブラウザチャット</title>
<style>
:root{--bg:#fff;--side:#f4f4f6;--line:#dcdce2;--fg:#1d1d22;--sub:#6b6b76;--acc:#2f6fed;--user:#e9f0ff;--bot:#f6f6f8;--code:#17181c}
@media(prefers-color-scheme:dark){:root{--bg:#16171b;--side:#1d1e23;--line:#34353c;--fg:#e8e8ee;--sub:#9a9aa6;--acc:#6b9bff;--user:#23304d;--bot:#202126;--code:#0d0e11}}
*{box-sizing:border-box}
body{margin:0;height:100vh;display:flex;font:15px/1.6 system-ui,"Hiragino Sans","Yu Gothic",sans-serif;background:var(--bg);color:var(--fg)}
#side{width:260px;background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:10px;gap:8px}
#list{flex:1;overflow:auto;display:flex;flex-direction:column;gap:2px}
.item{padding:8px 10px;border-radius:8px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;justify-content:space-between;gap:6px}
.item:hover{background:var(--line)}.item.on{background:var(--line);font-weight:600}
.item button{display:none;border:0;background:none;color:var(--sub);cursor:pointer;padding:0 2px}
.item:hover button{display:inline}
button,select,input,textarea{font:inherit;color:inherit}
.btn{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:7px 10px;cursor:pointer}
.btn:hover{border-color:var(--acc)}.btn.p{background:var(--acc);border-color:var(--acc);color:#fff}
#main{flex:1;display:flex;flex-direction:column;min-width:0}
#top{display:flex;gap:8px;align-items:center;padding:8px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap}
#top input,#top select{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:6px 8px}
#msgs{flex:1;overflow:auto;padding:16px 14px}
.row{max-width:820px;margin:0 auto 14px}
.who{font-size:12px;color:var(--sub);margin-bottom:2px}
.bub{padding:10px 14px;border-radius:12px;background:var(--bot);white-space:pre-wrap;word-break:break-word}
.row.user .bub{background:var(--user)}
.bub pre{background:var(--code);color:#e6e6ec;padding:10px;border-radius:8px;overflow:auto;white-space:pre;position:relative;margin:8px 0}
.bub code.i{background:var(--line);padding:1px 4px;border-radius:4px}
.cp{position:absolute;right:6px;top:6px;font-size:11px;border:1px solid #555;background:#2a2b31;color:#ddd;border-radius:6px;cursor:pointer}
.err{color:#d33}
#bar{border-top:1px solid var(--line);padding:10px 14px}
#bar .in{max-width:820px;margin:0 auto;display:flex;gap:8px}
#inp{flex:1;resize:none;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:9px 12px;max-height:200px}
#note{max-width:820px;margin:6px auto 0;font-size:12px;color:var(--sub)}
#sys{display:none;width:100%}
@media(max-width:700px){#side{display:none}}
</style>
</head>
<body>
<div id="side">
  <button class="btn p" id="new">＋ 新しいチャット</button>
  <div id="list"></div>
  <button class="btn" id="exp">履歴を書き出す</button>
  <button class="btn" id="imp">履歴を読み込む</button>
  <input type="file" id="file" accept="application/json" hidden>
</div>
<div id="main">
  <div id="top">
    <input id="key" type="password" placeholder="OpenAI APIキー (sk-...)" size="26" autocomplete="off">
    <input id="model" list="models" value="gpt-4o-mini" size="16" title="モデル名">
    <datalist id="models"><option value="gpt-4o-mini"><option value="gpt-4o"><option value="gpt-3.5-turbo"></datalist>
    <button class="btn" id="sysb">システム指示</button>
    <textarea id="sys" rows="2" placeholder="このチャットのシステム指示 (任意)"></textarea>
  </div>
  <div id="msgs"></div>
  <div id="bar">
    <div class="in">
      <textarea id="inp" rows="1" placeholder="メッセージを入力 (Enterで送信 / Shift+Enterで改行)"></textarea>
      <button class="btn p" id="send">送信</button>
      <button class="btn" id="stop" hidden>停止</button>
    </div>
    <div id="note">キーも履歴もこのブラウザ内にだけ保存されます。送信先はOpenAIのAPIのみ。使った分のAPI料金はご自身のOpenAIアカウントに請求されます。</div>
  </div>
</div>
<script>
(function(){
var $=function(i){return document.getElementById(i)};
var S={chats:[],cur:null};
try{S=JSON.parse(localStorage.getItem('keychat.v1'))||S}catch(e){}
var abort=null;
function save(){localStorage.setItem('keychat.v1',JSON.stringify(S))}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function cur(){return S.chats.find(function(c){return c.id===S.cur})}
function newChat(){var c={id:uid(),title:'新しいチャット',sys:'',msgs:[]};S.chats.unshift(c);S.cur=c.id;save();draw()}
function esc(s){return s.replace(/[&<>]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;'}[c]})}
function md(t){
  var parts=t.split('```'),o='';
  for(var i=0;i<parts.length;i++){
    if(i%2){var p=parts[i],n=p.indexOf('\n');var body=n>=0?p.slice(n+1):p;
      o+='<pre><button class="cp">コピー</button><code>'+esc(body.replace(/\n$/,''))+'</code></pre>'}
    else o+=esc(parts[i]).replace(/`([^`\n]+)`/g,'<code class="i">$1</code>').replace(/\*\*([^*\n]+)\*\*/g,'<b>$1</b>');
  }
  return o;
}
function drawList(){
  var l=$('list');l.innerHTML='';
  S.chats.forEach(function(c){
    var d=document.createElement('div');d.className='item'+(c.id===S.cur?' on':'');
    var s=document.createElement('span');s.textContent=c.title;d.appendChild(s);
    var b=document.createElement('button');b.textContent='✕';b.title='削除';
    b.onclick=function(e){e.stopPropagation();if(!confirm('このチャットを削除しますか?'))return;
      S.chats=S.chats.filter(function(x){return x.id!==c.id});if(S.cur===c.id)S.cur=S.chats[0]?S.chats[0].id:null;
      if(!S.cur){newChat();return}save();draw()};
    d.appendChild(b);d.onclick=function(){S.cur=c.id;save();draw()};l.appendChild(d)});
}
function bubble(m){
  var r=document.createElement('div');r.className='row '+m.role;
  r.innerHTML='<div class="who">'+(m.role==='user'?'あなた':'AI')+'</div><div class="bub"></div>';
  r.lastChild.innerHTML=md(m.content);return r;
}
function drawMsgs(){
  var c=cur(),box=$('msgs');box.innerHTML='';
  c.msgs.forEach(function(m){box.appendChild(bubble(m))});
  $('sys').value=c.sys||'';box.scrollTop=box.scrollHeight;
}
function draw(){if(!S.cur||!cur()){newChat();return}drawList();drawMsgs()}
$('msgs').addEventListener('click',function(e){
  if(e.target.className==='cp'){var t=e.target.parentNode.querySelector('code').textContent;
    navigator.clipboard.writeText(t);e.target.textContent='済';setTimeout(function(){e.target.textContent='コピー'},1200)}});
$('new').onclick=newChat;
$('sysb').onclick=function(){var s=$('sys');s.style.display=s.style.display==='block'?'none':'block'};
$('sys').oninput=function(){cur().sys=this.value;save()};
$('key').value=localStorage.getItem('keychat.key')||'';
$('key').onchange=function(){localStorage.setItem('keychat.key',this.value.trim())};
$('model').value=localStorage.getItem('keychat.model')||$('model').value;
$('model').onchange=function(){localStorage.setItem('keychat.model',this.value.trim())};
$('exp').onclick=function(){var a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([JSON.stringify({chats:S.chats})],{type:'application/json'}));
  a.download='keychat-history.json';a.click()};
$('imp').onclick=function(){$('file').click()};
$('file').onchange=function(){var f=this.files[0];if(!f)return;var r=new FileReader();
  r.onload=function(){try{var d=JSON.parse(r.result);if(!Array.isArray(d.chats))throw 0;
    d.chats.forEach(function(c){c.id=uid();S.chats.push(c)});save();draw()}catch(e){alert('読み込めないファイルです')}};r.readAsText(f)};
function setBusy(b){$('send').hidden=b;$('stop').hidden=!b}
$('stop').onclick=function(){if(abort)abort.abort()};
async function send(){
  var txt=$('inp').value.trim();if(!txt||abort)return;
  var key=$('key').value.trim();if(!key){alert('先にOpenAI APIキーを入力してください');return}
  localStorage.setItem('keychat.key',key);localStorage.setItem('keychat.model',$('model').value.trim());
  var c=cur();c.msgs.push({role:'user',content:txt});
  if(c.msgs.length===1){c.title=txt.slice(0,28)}
  $('inp').value='';$('inp').style.height='';
  var ai={role:'assistant',content:''};c.msgs.push(ai);save();drawList();drawMsgs();
  var bub=$('msgs').lastChild.lastChild;
  var hist=c.msgs.slice(0,-1).map(function(m){return{role:m.role,content:m.content}});
  if(c.sys)hist.unshift({role:'system',content:c.sys});
  abort=new AbortController();setBusy(true);
  try{
    var res=await fetch('https://api.openai.com/v1/chat/completions',{method:'POST',signal:abort.signal,
      headers:{'Content-Type':'application/json','Authorization':'Bearer '+key},
      body:JSON.stringify({model:$('model').value.trim(),messages:hist,stream:true})});
    if(!res.ok){var e=await res.json().catch(function(){return{}});throw new Error((e.error&&e.error.message)||('HTTP '+res.status))}
    var rd=res.body.getReader(),dec=new TextDecoder(),buf='';
    for(;;){var x=await rd.read();if(x.done)break;buf+=dec.decode(x.value,{stream:true});
      var lines=buf.split('\n');buf=lines.pop();
      for(var i=0;i<lines.length;i++){var ln=lines[i].trim();
        if(ln.indexOf('data:')!==0)continue;var p=ln.slice(5).trim();if(p==='[DONE]')continue;
        try{var d=JSON.parse(p).choices[0].delta.content;if(d){ai.content+=d;bub.innerHTML=md(ai.content);$('msgs').scrollTop=$('msgs').scrollHeight}}catch(e){}}}
  }catch(e){
    if(e.name!=='AbortError'){ai.content+=(ai.content?'\n\n':'')+'[エラー] '+e.message;bub.innerHTML=md(ai.content);bub.classList.add('err')}
  }
  if(!ai.content){c.msgs.pop()}
  abort=null;setBusy(false);save();drawMsgs();
}
$('send').onclick=send;
$('inp').addEventListener('keydown',function(e){if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();send()}});
$('inp').addEventListener('input',function(){this.style.height='auto';this.style.height=Math.min(this.scrollHeight,200)+'px'});
draw();
})();
</script>
</body>
</html>
